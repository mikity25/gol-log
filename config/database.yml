# 共通のベース設定
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# 開発環境（手元のDockerで動く設定）
development:
  <<: *default
  database: myapp_development
  username: postgres
  password: password
  host: db

# テスト環境（RSpecなどの自動テスト用）
test:
  <<: *default
  database: myapp_test
  username: postgres
  password: password
  host: db

# 本番環境（Render本番サーバー用：Solid Cable等にも対応）
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
  queue:
    <<: *primary_production
  cable:
    <<: *primary_production